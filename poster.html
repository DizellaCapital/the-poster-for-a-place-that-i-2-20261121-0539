<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AERTHYS — Where the Sea Sails the Sky</title>
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; overflow: hidden; background: #052028; }
  svg { display: block; width: 1024px; height: 1024px; }
  .name { font-family: 'Noto Serif Display', serif; font-weight: 900; font-size: 118px; letter-spacing: 22px; fill: #f6ecd2; }
  .tag { font-family: 'Noto Sans Display', sans-serif; font-weight: 400; font-size: 29px; letter-spacing: 10px; fill: #f6ecd2; }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="664">
      <stop offset="0" stop-color="#052028"/>
      <stop offset="0.45" stop-color="#0a3d47"/>
      <stop offset="0.72" stop-color="#12606a"/>
      <stop offset="0.90" stop-color="#3f7d6e"/>
      <stop offset="0.985" stop-color="#e0a04a"/>
      <stop offset="1" stop-color="#e8b45c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#f6b73c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6b73c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9ad"/>
      <stop offset="0.7" stop-color="#f9c34d"/>
      <stop offset="1" stop-color="#e89b2e"/>
    </radialGradient>
    <linearGradient id="haze" gradientUnits="userSpaceOnUse" x1="0" y1="596" x2="0" y2="664">
      <stop offset="0" stop-color="#e8a94c" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8a94c" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="cliff" gradientUnits="userSpaceOnUse" x1="0" y1="664" x2="0" y2="872">
      <stop offset="0" stop-color="#0a242c"/>
      <stop offset="1" stop-color="#06181d"/>
    </linearGradient>
  </defs>

  <!-- ======== sky-sea ======== -->
  <rect x="0" y="0" width="1024" height="664" fill="url(#sky)"/>

  <!-- stars, upper corners -->
  <g fill="#f6ecd2">
    <circle cx="90" cy="60" r="2.2" opacity="0.7"/><circle cx="150" cy="110" r="1.6" opacity="0.5"/>
    <circle cx="930" cy="70" r="2" opacity="0.6"/><circle cx="880" cy="130" r="1.5" opacity="0.45"/>
    <circle cx="60" cy="180" r="1.5" opacity="0.4"/><circle cx="965" cy="200" r="1.8" opacity="0.5"/>
    <circle cx="240" cy="70" r="1.4" opacity="0.4"/><circle cx="800" cy="60" r="1.4" opacity="0.4"/>
  </g>

  <!-- birds -->
  <g stroke="#f6ecd2" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M 250,268 q 7,-7 14,0 q 7,-7 14,0"/>
    <path d="M 300,240 q 6,-6 12,0 q 6,-6 12,0"/>
    <path d="M 850,300 q 7,-7 14,0 q 7,-7 14,0"/>
  </g>

  <!-- soft clouds -->
  <g fill="#f6ecd2">
    <ellipse cx="180" cy="300" rx="120" ry="13" opacity="0.05"/>
    <ellipse cx="830" cy="250" rx="140" ry="14" opacity="0.05"/>
    <ellipse cx="880" cy="420" rx="110" ry="12" opacity="0.04"/>
    <ellipse cx="130" cy="450" rx="100" ry="11" opacity="0.04"/>
  </g>

  <!-- sun + glow -->
  <circle cx="742" cy="520" r="150" fill="url(#sunGlow)"/>
  <circle cx="742" cy="520" r="54" fill="url(#sunDisc)"/>

  <!-- sky-sea waves -->
  <g stroke="#8fd0cf" fill="none" stroke-linecap="round">
    <path d="M 60,286 Q 180,272 300,286 T 540,286 T 780,286" stroke-width="2.5" opacity="0.28"/>
    <path d="M 120,340 Q 260,328 400,340 T 680,340 T 940,340" stroke-width="2.5" opacity="0.32"/>
    <path d="M 40,398 Q 170,386 300,398 T 560,398 T 820,398 T 980,398" stroke-width="2.5" opacity="0.26"/>
    <path d="M 90,452 Q 220,440 350,452 T 610,452 T 880,452" stroke-width="2" opacity="0.30"/>
    <path d="M 60,586 Q 170,576 280,586 T 500,586" stroke-width="2" opacity="0.30"/>
    <path d="M 700,600 Q 800,590 900,600 T 980,600" stroke-width="2" opacity="0.30"/>
    <path d="M 150,630 Q 260,620 370,630 T 590,630" stroke-width="2" opacity="0.34"/>
    <path d="M 660,636 Q 780,626 900,636" stroke-width="2" opacity="0.34"/>
  </g>
  <rect x="0" y="596" width="1024" height="68" fill="url(#haze)"/>

  <!-- ======== tall ship (hero) ======== -->
  <g>
    <!-- rigging -->
    <g stroke="#0a2b33" stroke-width="1.4" opacity="0.55">
      <line x1="516" y1="302" x2="372" y2="576"/>
      <line x1="516" y1="302" x2="656" y2="576"/>
      <line x1="452" y1="330" x2="372" y2="576"/>
      <line x1="580" y1="344" x2="656" y2="576"/>
      <line x1="452" y1="330" x2="700" y2="550"/>
    </g>
    <!-- jib sail -->
    <path d="M 456,346 L 694,548 L 456,498 Z" fill="#f8ebc9" stroke="#d9a441" stroke-width="1.5"/>
    <!-- mizzen lateen sail -->
    <path d="M 584,348 L 648,502 L 584,502 Z" fill="#f3e2b6" stroke="#d9a441" stroke-width="1.5"/>
    <!-- fore mast sails -->
    <path d="M 434,330 L 470,330 Q 468,354 466,376 Q 452,381 438,376 Q 436,354 434,330 Z" fill="#f8ebc9" stroke="#d9a441" stroke-width="1.5"/>
    <path d="M 430,386 L 474,386 Q 471,420 468,452 Q 452,458 436,452 Q 433,420 430,386 Z" fill="#f8ebc9" stroke="#d9a441" stroke-width="1.5"/>
    <!-- main mast sails -->
    <path d="M 494,308 L 538,308 Q 536,336 533,362 Q 516,368 499,362 Q 496,336 494,308 Z" fill="#f8ebc9" stroke="#d9a441" stroke-width="1.5"/>
    <path d="M 492,372 L 540,372 Q 537,400 534,428 Q 516,434 498,428 Q 495,400 492,372 Z" fill="#f8ebc9" stroke="#d9a441" stroke-width="1.5"/>
    <path d="M 488,438 L 544,438 Q 541,478 537,516 Q 516,524 495,516 Q 491,478 488,438 Z" fill="#f8ebc9" stroke="#d9a441" stroke-width="1.5"/>
    <!-- sail seams -->
    <g stroke="#d9a441" stroke-width="1" opacity="0.55">
      <line x1="496" y1="335" x2="535" y2="335"/>
      <line x1="494" y1="400" x2="538" y2="400"/>
      <line x1="490" y1="477" x2="542" y2="477"/>
      <line x1="435" y1="353" x2="469" y2="353"/>
      <line x1="432" y1="419" x2="472" y2="419"/>
    </g>
    <!-- masts -->
    <g stroke="#0a2b33" stroke-width="6" stroke-linecap="round">
      <line x1="452" y1="326" x2="452" y2="578"/>
      <line x1="516" y1="296" x2="516" y2="578"/>
      <line x1="580" y1="340" x2="580" y2="578"/>
    </g>
    <!-- yards -->
    <g stroke="#0a2b33" stroke-width="4" stroke-linecap="round">
      <line x1="428" y1="310" x2="476" y2="310"/>
      <line x1="424" y1="374" x2="480" y2="374"/>
      <line x1="488" y1="300" x2="544" y2="300"/>
      <line x1="486" y1="364" x2="546" y2="364"/>
      <line x1="482" y1="432" x2="550" y2="432"/>
    </g>
    <!-- pennants -->
    <path d="M 516,296 L 542,302 L 516,309 Z" fill="#e8a94c"/>
    <path d="M 452,326 L 472,331 L 452,337 Z" fill="#e8a94c"/>
    <!-- bowsprit -->
    <line x1="654" y1="572" x2="706" y2="546" stroke="#0a2b33" stroke-width="5" stroke-linecap="round"/>
    <!-- stern castle -->
    <path d="M 372,578 L 372,548 L 410,548 L 410,578 Z" fill="#0a2b33"/>
    <!-- hull -->
    <path d="M 368,578 L 660,578 Q 650,606 600,616 Q 520,624 450,616 Q 396,608 368,578 Z" fill="#0a2b33"/>
    <path d="M 372,580 L 656,580" stroke="#e8a94c" stroke-width="3"/>
    <!-- hull portholes -->
    <g fill="#f6b73c">
      <circle cx="420" cy="596" r="3.5"/><circle cx="470" cy="601" r="3.5"/>
      <circle cx="520" cy="603" r="3.5"/><circle cx="570" cy="601" r="3.5"/>
      <circle cx="618" cy="596" r="3.5"/>
    </g>
    <!-- reflection shimmer under hull -->
    <g stroke="#e8a94c" stroke-width="2" stroke-linecap="round" opacity="0.45">
      <line x1="420" y1="634" x2="470" y2="634"/>
      <line x1="500" y1="640" x2="570" y2="640"/>
      <line x1="440" y1="650" x2="520" y2="650"/>
      <line x1="560" y1="652" x2="620" y2="652"/>
    </g>
  </g>

  <!-- horizon line -->
  <line x1="30" y1="664" x2="994" y2="664" stroke="#e0aa4a" stroke-width="2" opacity="0.85"/>

  <!-- ======== cliff town ======== -->
  <rect x="30" y="664" width="964" height="208" fill="url(#cliff)"/>
  <!-- strata lines on cliff face -->
  <g stroke="#1d4b55" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 40,720 Q 300,712 560,720 T 980,716"/>
    <path d="M 40,790 Q 320,782 620,790 T 980,786"/>
    <path d="M 40,840 Q 300,834 580,840 T 980,838"/>
  </g>
  <!-- town silhouettes along the horizon, flanking the ship -->
  <g fill="#06181d">
    <!-- left cluster -->
    <rect x="58" y="632" width="46" height="32"/><path d="M 54,632 L 81,614 L 108,632 Z"/>
    <rect x="112" y="620" width="38" height="44"/><path d="M 108,620 L 131,602 L 154,620 Z"/>
    <rect x="158" y="636" width="52" height="28"/><path d="M 154,636 L 184,618 L 214,636 Z"/>
    <rect x="222" y="626" width="40" height="38"/><path d="M 218,626 L 242,610 L 266,626 Z"/>
    <rect x="270" y="638" width="56" height="26"/><path d="M 266,638 L 298,622 L 330,638 Z"/>
    <!-- right cluster -->
    <rect x="700" y="636" width="54" height="28"/><path d="M 696,636 L 727,620 L 758,636 Z"/>
    <rect x="764" y="624" width="42" height="40"/><path d="M 760,624 L 785,606 L 810,624 Z"/>
    <rect x="814" y="634" width="50" height="30"/><path d="M 810,634 L 839,616 L 868,634 Z"/>
    <rect x="874" y="622" width="40" height="42"/><path d="M 870,622 L 894,604 L 918,622 Z"/>
    <rect x="924" y="636" width="48" height="28"/><path d="M 920,636 L 948,620 L 976,636 Z"/>
    <!-- cypress trees -->
    <path d="M 344,664 Q 338,634 346,612 Q 354,634 348,664 Z"/>
    <path d="M 682,664 Q 676,638 684,618 Q 692,638 686,664 Z"/>
  </g>
  <!-- lit windows in the town -->
  <g fill="#ffd97a">
    <rect x="70" y="640" width="6" height="8"/><rect x="86" y="640" width="6" height="8"/>
    <rect x="124" y="630" width="6" height="8"/><rect x="136" y="646" width="6" height="8"/>
    <rect x="172" y="644" width="6" height="8"/><rect x="192" y="644" width="6" height="8"/>
    <rect x="234" y="634" width="6" height="8"/><rect x="248" y="648" width="6" height="8"/>
    <rect x="286" y="646" width="6" height="8"/><rect x="306" y="646" width="6" height="8"/>
    <rect x="716" y="644" width="6" height="8"/><rect x="736" y="644" width="6" height="8"/>
    <rect x="778" y="632" width="6" height="8"/><rect x="790" y="648" width="6" height="8"/>
    <rect x="828" y="642" width="6" height="8"/><rect x="846" y="642" width="6" height="8"/>
    <rect x="886" y="630" width="6" height="8"/><rect x="898" y="646" width="6" height="8"/>
    <rect x="938" y="644" width="6" height="8"/><rect x="954" y="644" width="6" height="8"/>
  </g>
  <!-- lit windows in the cliff face -->
  <g fill="#ffd97a">
    <rect x="120" y="700" width="7" height="9" opacity="0.95"/><rect x="140" y="700" width="7" height="9" opacity="0.8"/>
    <rect x="250" y="740" width="7" height="9" opacity="0.9"/><rect x="270" y="740" width="7" height="9" opacity="0.7"/>
    <rect x="420" y="712" width="7" height="9" opacity="0.95"/><rect x="440" y="712" width="7" height="9" opacity="0.75"/>
    <rect x="560" y="760" width="7" height="9" opacity="0.9"/><rect x="580" y="760" width="7" height="9" opacity="0.7"/>
    <rect x="700" y="706" width="7" height="9" opacity="0.95"/><rect x="720" y="706" width="7" height="9" opacity="0.8"/>
    <rect x="830" y="748" width="7" height="9" opacity="0.9"/><rect x="850" y="748" width="7" height="9" opacity="0.7"/>
    <rect x="900" y="700" width="7" height="9" opacity="0.85"/>
    <rect x="60" y="800" width="7" height="9" opacity="0.8"/><rect x="330" y="812" width="7" height="9" opacity="0.75"/>
    <rect x="640" y="820" width="7" height="9" opacity="0.8"/><rect x="940" y="812" width="7" height="9" opacity="0.75"/>
    <rect x="470" y="800" width="7" height="9" opacity="0.8"/><rect x="490" y="800" width="7" height="9" opacity="0.65"/>
    <rect x="720" y="790" width="7" height="9" opacity="0.75"/><rect x="180" y="770" width="7" height="9" opacity="0.7"/>
  </g>
  <!-- soft glow behind town windows -->
  <g fill="#f6b73c" opacity="0.10">
    <ellipse cx="200" cy="640" rx="150" ry="26"/>
    <ellipse cx="830" cy="636" rx="150" ry="26"/>
  </g>

  <!-- ======== bottom band + tagline ======== -->
  <rect x="0" y="872" width="1024" height="152" fill="#052028"/>
  <g stroke="#c9a24b" stroke-width="2">
    <line x1="52" y1="916" x2="128" y2="916"/>
    <line x1="896" y1="916" x2="972" y2="916"/>
  </g>
  <text x="512" y="926" text-anchor="middle" class="tag">WHERE THE SEA SAILS THE SKY</text>

  <!-- ======== name + ornament ======== -->
  <text x="518" y="168" text-anchor="middle" class="name">AERTHYS</text>
  <g stroke="#c9a24b" stroke-width="2">
    <line x1="382" y1="196" x2="478" y2="196"/>
    <line x1="546" y1="196" x2="642" y2="196"/>
  </g>
  <rect x="508" y="191" width="9" height="9" fill="#c9a24b" transform="rotate(45 512 196)"/>

  <!-- ======== frame ======== -->
  <rect x="14" y="14" width="996" height="996" fill="none" stroke="#f2e6c8" stroke-width="28"/>
  <rect x="32" y="32" width="960" height="960" fill="none" stroke="#c9a24b" stroke-width="2"/>
</svg>
</body>
</html>
